spring:
  application:
    name: Exception_Log_Valid_Actuator
  profiles:
    active: local

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics     # 이 세 개만 엽니다
  endpoint:
    health:
      show-details: always                 # 항목별 결과까지 보여줍니다
  info:
    env:
      enabled: true                        # 아래 info 값을 노출합니다

info:
  app:
    name: 성적 관리 API
    version: 1.0.0
    owner: backend-team


---
spring:
  config:
    activate:
      on-profile: local

logging:
  level:
    root: INFO
    com.example.exception_log_valid_actuator: DEBUG

---
spring:
  config:
    activate:
      on-profile: prod

logging:
  level:
    root: INFO
    com.example.exception_log_valid_actuator: INFO